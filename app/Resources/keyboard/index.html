  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:40px 80px}

   if(rebuild)applyMode();if(flatV)flatV.decorate();views.forEach(v=>v.dirty=true);
 },
 setLiveFrame(frame){liveFrame=frame;views.forEach(v=>v.dirty=true);},
 press(id){press(id,true);},
 setSelected(id){selected=id;if(flatV)flatV.decorate();views.forEach(v=>v.dirty=true);},
 setLegends(value){if(JSON.stringify(legends)===JSON.stringify(value))return;legends=value;redrawLegends();if(mode==="flat")buildFlat();views.forEach(v=>v.dirty=true);},
 setActive(value){active=value;views.forEach(v=>v.dirty=true);},
 verified(id){const el=document.querySelector(`[data-id="${id}"]`);if(el&&!RM)el.animate([{transform:"rotateX(0deg)"},{transform:"rotateX(180deg)"},{transform:"rotateX(360deg)"}],{duration:340,easing:"cubic-bezier(.2,.8,.2,1)"});else if(el)el.animate([{opacity:.3},{opacity:1}],{duration:220});press(id,true);},
 inspect(){return {keys:KEYS.length,mode,style,camera,colourway:flatState.cw,effect:flatState.effect,slot:{...SLOT},palette,live:!!liveFrame,selected,active,legends};}
};
applyMode();
let lastTick=0;
function loop(ms){requestAnimationFrame(loop);if(!active||ms-lastTick<50)return;lastTick=ms;
 const now=RM?1.2:ms/1000;views.forEach(v=>{if(!RM||v.dirty)v.frame(now,ms);});}
requestAnimationFrame(loop);post("ready");
})();
